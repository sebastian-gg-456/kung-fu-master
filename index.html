<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kung Fu Master - Phaser 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: black;
            overflow: hidden;
        }
        body {
            margin: 2px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        #ui-bar {
            width: min(2200px, calc(100vw - 12px));
            min-height: 140px;
            background: #000;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            border-bottom: 2px solid #fff;
        }
        #ui-bar .ui-group {
            display: flex;
            gap: 40px;
            align-items: center;
        }
        #ui-bar .ui-group span {
            color: #00ff00;
            font-size: 28px;
        }
        #hp-bar-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }
        #hp-bar-wrap label {
            font-size: 16px;
            color: #ffdd00;
        }
        #hp-track {
            width: 220px;
            height: 22px;
            background: #333;
            border: 2px solid #888;
            border-radius: 3px;
            overflow: hidden;
        }
        #hp-fill {
            height: 100%;
            width: 100%;
            background: #00cc00;
            transition: width 0.1s, background 0.1s;
        }
        #ui-bar-bottom {
            width: min(2200px, calc(100vw - 12px));
            min-height: 60px;
            background: #000;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            border-top: 2px solid #fff;
        }
        #ui-bar-bottom .ui-group {
            display: flex;
            gap: 40px;
            align-items: center;
        }
        #ui-bar-bottom .ui-group span {
            color: #00ff00;
            font-size: 28px;
        }
        #game-container {
            width: min(2200px, calc(100vw - 12px));
            height: min(560px, calc(100vh - 214px));
            min-height: 280px;
            box-sizing: border-box;
        }
        #game-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <div id="ui-bar">
        <div class="ui-group">
            <div>Vidas: <span id="lives-value">3</span></div>
            <div>Puntuación: <span id="score-value">0</span></div>
        </div>
        <div id="hp-bar-wrap">
            <label>HP</label>
            <div id="hp-track"><div id="hp-fill"></div></div>
        </div>
        <div class="ui-group">
            <div>Nivel: <span id="level-value">1</span></div>
        </div>
    </div>
    <div id="game-container"></div>
    <div id="ui-bar-bottom">
        <div class="ui-group">
            <div>Estado: <span id="status-value">JUGANDO</span></div>
            <div>Enemigos: <span id="enemies-value">0</span></div>
        </div>
        <div class="ui-group">
            <div>Tiempo: <span id="time-value">00:00</span></div>
        </div>
    </div>
    <script src="main.js"></script>
    <script src="game.js"></script>
</body>
</html>
